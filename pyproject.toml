[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wireguard-telegram-bot"
version = "0.1.0"
description = "Telegram bot for WireGuard user provisioning on MikroTik RouterOS"
requires-python = ">=3.13"
dependencies = [
    "aiogram==3.30.0",
    "cryptography==49.0.0",
    "python-dotenv>=1.1,<2",
    "librouteros==4.1.1",
    "Pillow>=11.3,<13",
    "PyYAML>=6.0.2,<7",
    "qrcode[pil]>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["bot*"]
